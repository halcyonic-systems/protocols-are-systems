name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Graphviz for the dependency graph, kpsewhich for plasTeX inputs
        run: sudo apt-get update && sudo apt-get install -y graphviz libgraphviz-dev texlive-binaries
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Blueprint (web)
        run: |
          pip install leanblueprint==0.0.20 plasTeX==3.1 plastexdepgraph==0.0.5 plastexshowmore==0.0.2 pygraphviz==2.0.3
          leanblueprint web
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: Jekyll
        run: bundle exec jekyll build
      - name: Assemble
        run: rm -rf _site/blueprint && cp -R blueprint/web _site/blueprint
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
