<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
<header class="site-header">
  <a class="wordmark" href="{{ '/' | relative_url }}">Protocols are systems</a>
  <nav>
    <a href="{{ '/core/' | relative_url }}"{% if page.url == '/core/' %} aria-current="page"{% endif %}>The core</a>
    <a href="{{ '/instances/' | relative_url }}"{% if page.url == '/instances/' %} aria-current="page"{% endif %}>Instances</a>
    <a href="{{ '/questions/' | relative_url }}"{% if page.url == '/questions/' %} aria-current="page"{% endif %}>Questions</a>
    <a href="{{ '/talk/' | relative_url }}"{% if page.url == '/talk/' %} aria-current="page"{% endif %}>Talk</a>
  </nav>
</header>
<main>
{{ content }}
</main>
<footer class="site-footer">
  <a href="https://github.com/halcyonic-systems/protocols-are-systems">Source and Lean files</a>
  <span>·</span>
  <a href="https://halcyonic.systems/">Halcyonic Systems</a>
  <span>·</span>
  <span>MIT license</span>
</footer>
</body>
</html>
