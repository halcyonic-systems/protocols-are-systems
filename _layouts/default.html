<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aaaakshat/cm-web-fonts@latest/font/Serif/cmun-serif.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body,{delimiters:[{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],throwOnError:false})"></script>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
<header>
  <a class="home" href="{{ '/' | relative_url }}">Protocols are systems</a>
  <nav>
    <a href="{{ '/blueprint/' | relative_url }}">Blueprint</a>
    <a href="{{ '/questions/' | relative_url }}"{% if page.url == '/questions/' %} aria-current="page"{% endif %}>Questions</a>
    <a href="{{ '/talk/' | relative_url }}"{% if page.url == '/talk/' %} aria-current="page"{% endif %}>Talk</a>
    <a href="https://github.com/halcyonic-systems/protocols-are-systems">Source</a>
  </nav>
</header>
<main>
{{ content }}
</main>
<footer>
  Shingai Thornton · <a href="https://halcyonic.systems/">Halcyonic Systems</a> · MIT license
</footer>
</body>
</html>
